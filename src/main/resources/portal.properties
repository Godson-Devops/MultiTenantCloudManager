# Portal configuration. Secrets are read from environment variables first
# (OPENSTACK_PASSWORD, K8S_TOKEN, MONGO_PASSWORD, ...), so this file only
# needs non-secret defaults.
mongo.uri=mongodb://localhost:27017
mongo.database=cloudportal

quota.default_max_vm=3
quota.default_max_pod=3

sync.period_seconds=30

openstack.auth_url=http://localhost:5000/v3
openstack.username=admin
openstack.domain=Default
openstack.project=service

k8s.master_url=https://kubernetes.default.svc
k8s.trust_certs=true
k8s.namespace_prefix=user-

prometheus.url=http://localhost:9090

pod.logs.max_duration_ms=60000
